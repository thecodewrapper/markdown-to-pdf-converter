<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown to PDF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <strong>Markdown to PDF</strong>
          <span class="document-name" id="document-name">Untitled.md</span>
        </div>
      </div>
      <div class="actions">
        <button class="button button-quiet" id="template-button">New</button>
        <button class="button button-quiet" id="open-button">Open</button>
        <button class="button button-quiet" id="save-button">Save</button>
        <span class="divider"></span>
        <label class="export-option" title="Start each top-level heading on a new PDF page">
          <input type="checkbox" id="page-break-sections" />
          <span>Page breaks</span>
        </label>
        <button class="button button-icon" id="theme-button" aria-label="Toggle dark mode">◐</button>
        <button class="button button-primary" id="export-button"><span>Export PDF</span><kbd>Ctrl E</kbd></button>
      </div>
    </header>
    <main class="workspace">
      <section class="pane editor-pane">
        <div class="pane-header"><span>MARKDOWN</span><span class="pane-hint">Write freely</span></div>
        <textarea id="editor" spellcheck="false" aria-label="Markdown editor"></textarea>
      </section>
      <div class="splitter" aria-hidden="true"></div>
      <section class="pane preview-pane">
        <div class="pane-header"><span>PREVIEW</span><span class="pane-hint">A4 document</span></div>
        <article class="paper" id="preview"></article>
      </section>
    </main>
    <footer class="statusbar">
      <span><i class="status-dot"></i><span id="status">Ready to export</span></span>
      <span id="word-count">0 words</span>
    </footer>
    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
